testing:
  sampling:
    measurements_count: 5
    total_duration_seconds: null
    sampling_frequency_hz: 2
  error_simulation:
    enabled: false
    probability: 0.0
    error_type: measurement_error

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"

analysis:
  statistical_metrics: [mean, median, standard_deviation, minimum, maximum]
  reference_current_a: null
  visualization:
    enabled: true
    directory: results/plots
    plot_types: [line, boxplot, histogram, rolling_mean]
    histogram_bins: 10
    rolling_window: 3

result_management:
  directory: results
